# A second instance of the bot (e.g. a staging bot with its own token) must
# run under another project name, or its `up` replaces this one's container.
# Set COMPOSE_PROJECT_NAME in its .env; it takes precedence over this name.
name: durys-soile-bot

services:
  bot:
    build: .
    restart: unless-stopped
    # TOKEN and API_BASE_URL; see .env.example.
    env_file: .env
    volumes:
      # The bot's state (last voice message per chat, long search filters),
      # so it survives restarts and redeploys.
      - bot_data:/data

volumes:
  bot_data:
